<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>exposure</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- reactive sound-wave field behind the keyboard -->
  <canvas id="stars" aria-hidden="true"></canvas>

  <header class="topbar">
    <span class="brand" title="Acoustic Exposure Monitor — reconstructs typing from microphone sound to show how exposed it is">
      <span class="brand-dot"></span>exposure
    </span>
  </header>

  <!-- typed-session history, quietly tucked on the left -->
  <aside id="history" class="glass history">
    <div class="panel-head">
      <span>history</span>
      <button id="clear-logs" class="mini-btn" title="clear all logs">clear</button>
    </div>
    <ul id="history-list" class="history-list"></ul>
  </aside>

  <main class="stage">
    <!-- what's being typed, live -->
    <div class="glass typed-card">
      <div id="typed" class="typed"></div>
      <button id="finish" class="finish-btn">finish ↵</button>
    </div>

    <!-- the Mac keyboard -->
    <div class="keyboard-wrap">
      <div id="keyboard" class="keyboard" data-theme="rgb" aria-label="predicted keystrokes"></div>
    </div>

    <!-- cycle keyboard designs -->
    <div class="theme-picker">
      <button class="theme-arrow" id="theme-prev" aria-label="Previous keyboard">‹</button>
      <span class="theme-name" id="theme-name">Aurora RGB</span>
      <button class="theme-arrow" id="theme-next" aria-label="Next keyboard">›</button>
    </div>
  </main>

  <!-- exposure readout: a quiet glass panel on the right saying why it's exposed -->
  <aside id="exposure" class="glass exposure-panel secure">
    <div class="exp-state" id="exp-state">secure</div>
    <div class="exp-why" id="exp-why">typing sound is too ambiguous to reconstruct</div>
    <div class="exp-meter"><div class="exp-meter-fill" id="exp-meter"></div></div>
    <div class="exp-hint">⌃⇧X to clear</div>
  </aside>

  <script src="js/source.js"></script>
  <script src="js/ambient.js"></script>
  <script src="js/keyboard.js"></script>
  <script src="js/panels.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
