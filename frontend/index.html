<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TypeLeak</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- reactive sound-wave field behind the keyboard -->
  <canvas id="stars" aria-hidden="true"></canvas>

  <header class="topbar">
    <span class="brand" title="Acoustic keystroke recognizer — reconstructs typing live from microphone sound">
      TypeLeak
    </span>
    <span id="source-pill" class="source-pill connecting">
      <span class="source-dot"></span>
      <span id="source-text">connecting</span>
    </span>
  </header>

  <!-- typed-session history, quietly tucked on the left -->
  <aside id="history" class="glass history">
    <div class="panel-head">
      <span>history</span>
      <button id="clear-logs" class="mini-btn" title="clear all logs">clear</button>
    </div>
    <ul id="history-list" class="history-list"></ul>
  </aside>

  <main class="stage">
    <!-- what's being typed, live -->
    <div class="typed-wrap">
      <div class="glass typed-card">
        <div id="typed" class="typed"></div>
        <button id="finish" class="finish-btn" title="log this line now">finish ↵</button>
      </div>
    </div>

    <!-- the Mac keyboard -->
    <div class="keyboard-wrap">
      <div id="keyboard" class="keyboard" data-theme="rgb" aria-label="predicted keystrokes"></div>
    </div>

    <!-- cycle keyboard designs -->
    <div class="theme-picker">
      <button class="theme-arrow" id="theme-prev" aria-label="Previous keyboard">‹</button>
      <span class="theme-name" id="theme-name">RGB</span>
      <button class="theme-arrow" id="theme-next" aria-label="Next keyboard">›</button>
    </div>
  </main>

  <!-- LLM correction control panel on the right -->
  <aside id="control" class="glass control-panel">
    <div class="ctrl-head">correction</div>

    <div class="ctrl-row">
      <span class="ctrl-label">LLM correction</span>
      <label class="switch" title="toggle live LLM spell-correction">
        <input type="checkbox" id="llm-toggle" />
        <span class="slider"></span>
      </label>
    </div>

    <div class="ctrl-state" id="ctrl-state">correcting</div>
    <div class="ctrl-status" id="ctrl-status">corrects the whole line when you pause typing</div>
    <div class="ctrl-note" id="ctrl-note"></div>

    <div class="ctrl-sep"></div>

    <ul class="ctrl-facts">
      <li><span>source</span><span id="ctrl-source">connecting…</span></li>
      <li><span>corrects</span><span id="ctrl-cadence">on pause or finish</span></li>
      <li><span>auto-log</span><span id="ctrl-idle">after silence</span></li>
    </ul>
    <div class="ctrl-hint">pause typing → the line is corrected, then logged on the left automatically</div>
  </aside>

  <script src="js/source.js"></script>
  <script src="js/ambient.js"></script>
  <script src="js/keyboard.js"></script>
  <script src="js/panels.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
